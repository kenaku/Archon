    \  else\n    check_changed_status=0\n\n    echo \"### pnpm check:changed (docker)\"\n    echo '```'\n    \"$ARTIFACTS_DIR/bin/frontend-docker-exec\"\
    \ pnpm check:changed\n    check_changed_status=$?\n    echo '```'\n    echo \"Exit code: ${check_changed_status}\"\n \
    \   echo\n\n    if [ \"$check_changed_status\" -eq 0 ]; then\n      echo \"Result: passed\"\n    else\n      echo \"Result:\
    \ failed\"\n    fi\n  fi\n} > \"$log\" 2>&1\ncat \"$log\"\nexit 0\n"
