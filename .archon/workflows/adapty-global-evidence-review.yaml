name: adapty-global-evidence-review
description: Evidence-based Adapty Dashboard review with compact reviewer packets and JSON artifacts.
provider: codex
model: gpt-5.5
modelReasoningEffort: low
nodes:
- id: resolve_target
  bash: 'set -eu

    ARGUMENTS="$ARGUMENTS" ARTIFACTS_DIR="$ARTIFACTS_DIR" .archon/scripts/adapty-resolve-target.py

    '
  timeout: 120000
- id: require_target
  bash: "if [ -f \"$ARTIFACTS_DIR/review/target.env\" ]; then\n  echo TARGET_READY\nelse\n  echo TARGET_MISSING\nfi\n"
  depends_on:
  - resolve_target
  timeout: 15000
- id: cancel_missing_target
  bash: 'echo "Target resolution blocked. Provide a full GitLab MR URL like https://gitlab.adapty.io/adapty/adapty-dashboard-interface/-/merge_requests/<iid>
    and rerun the workflow. See $ARTIFACTS_DIR/review/target.json for details." >&2

    exit 1

    '
  depends_on:
  - require_target
  when: $require_target.output == 'TARGET_MISSING'
- id: build_surface
  bash: 'set -eu

    ARTIFACTS_DIR="$ARTIFACTS_DIR" .archon/scripts/adapty-build-surface.py

    '
  depends_on:
  - require_target
  when: $require_target.output == 'TARGET_READY'
  timeout: 600000
- id: classify_review
  command: adapty-global-review-classify-review
  provider: claude
  model: claude-haiku-4-5
  effort: medium
  context: fresh
  depends_on:
  - build_surface
- id: assess_merge_readiness
  command: adapty-global-review-assess-merge-readiness
  provider: claude
  model: claude-haiku-4-5
  effort: medium
  context: fresh
  depends_on:
  - classify_review
- id: merge_readiness
  bash: "set -eu\nARTIFACTS_DIR=\"$ARTIFACTS_DIR\" python3 - <<'PYROUTE'\nimport json, os\n\nREVIEWERS = [\"architecture\"\
    , \"typescript\", \"races\", \"security_performance\", \"styling\", \"simplicity\", \"playbooks\"]\nCHECKS = [\"run_lint\"\
    , \"run_unit\", \"run_build\"]\n\ndef fail(message):\n    raise SystemExit(f\"Invalid merge-readiness routing contract:\
    \ {message}\")\n\ndef yes_no(value, key):\n    if isinstance(value, bool):\n        return \"yes\" if value else \"no\"\
    \n    if isinstance(value, (int, float)):\n        return \"yes\" if value else \"no\"\n    if isinstance(value, str):\n\
    \        lowered = value.strip().lower()\n        if lowered in {\"yes\", \"true\", \"1\", \"on\"}:\n            return\
    \ \"yes\"\n        if lowered in {\"no\", \"false\", \"0\", \"off\", \"\"}:\n            return \"no\"\n    fail(f\"{key}\
    \ must be boolean or yes/no, got {value!r}\")\n\ndef check_value(value, key):\n    normalized = yes_no(value, key)\n \
    \   if normalized in {\"yes\", \"true\"}:\n        return \"deferred_to_ci\"\n    if normalized == \"deferred_to_ci\"\
    :\n        return \"deferred_to_ci\"\n    return \"no\"\n\npath = os.path.join(os.environ[\"ARTIFACTS_DIR\"], \"review\"\
    , \"merge-readiness-preliminary.json\")\nwith open(path, encoding=\"utf-8\") as fh:\n    data = json.load(fh)\n\nreviewers\
    \ = data.get(\"reviewers\")\nif not isinstance(reviewers, dict):\n    fail(\"reviewers object is required\")\nchecks =\
    \ data.get(\"checks\")\nif not isinstance(checks, dict):\n    fail(\"checks object is required\")\nfor key in REVIEWERS:\n\
    \    if key not in reviewers:\n        fail(f\"reviewers.{key} is required\")\nfor key in CHECKS:\n    if key not in checks:\n\
    \        fail(f\"checks.{key} is required\")\n\nnormalized = dict(data)\nnormalized[\"fast_path\"] = yes_no(data.get(\"\
    fast_path\"), \"fast_path\")\nnormalized[\"full_review\"] = yes_no(data.get(\"full_review\"), \"full_review\")\nfor key\
    \ in REVIEWERS:\n    normalized[key] = yes_no(reviewers[key], f\"reviewers.{key}\")\nfor key in CHECKS:\n    normalized[key]\
    \ = check_value(checks[key], f\"checks.{key}\")\nif normalized[\"full_review\"] == \"yes\" and not any(normalized[key]\
    \ == \"yes\" for key in REVIEWERS):\n    fail(\"full_review=yes requires at least one reviewer routed yes\")\n\nnormalized_path\
    \ = os.path.join(os.environ[\"ARTIFACTS_DIR\"], \"review\", \"routing-normalized.json\")\nwith open(normalized_path, \"\
    w\", encoding=\"utf-8\") as fh:\n    json.dump(normalized, fh, ensure_ascii=False, indent=2)\n    fh.write(\"\\n\")\n\n\
    print(json.dumps(normalized, ensure_ascii=False, separators=(\",\", \":\")))\nPYROUTE\n"
  depends_on:
  - assess_merge_readiness
  timeout: 15000
- id: reviewer_budget
  bash: 'set -eu

    ARTIFACTS_DIR="$ARTIFACTS_DIR" .archon/scripts/adapty-apply-reviewer-budget.py'
  depends_on:
  - merge_readiness
  when: $merge_readiness.output.full_review == 'yes'
  timeout: 15000
- id: route_trace
  bash: "set -eu\nARTIFACTS_DIR=\"$ARTIFACTS_DIR\" python3 - <<'PYROUTE'\nimport json, os\npath = os.path.join(os.environ[\"\
    ARTIFACTS_DIR\"], \"review\", \"routing-normalized.json\")\nwith open(path, encoding=\"utf-8\") as fh:\n    data = json.load(fh)\n\
    full_review = data[\"full_review\"]\nreviewers = \", \".join(\n    f\"{key.replace('_', ' ')}: {data[key]}\"\n    for\
    \ key in [\"architecture\", \"typescript\", \"races\", \"security_performance\", \"styling\", \"simplicity\", \"playbooks\"\
    ]\n)\nprint(f\"Routing: {'full review' if full_review == 'yes' else 'fast path'}; checks deferred to CI; {reviewers}\"\
    )\nPYROUTE\n"
  depends_on:
  - reviewer_budget
  timeout: 15000
- id: build_reviewer_packets
  bash: 'set -eu

    ARTIFACTS_DIR="$ARTIFACTS_DIR" .archon/scripts/adapty-build-reviewer-packets.py'
  depends_on:
  - route_trace
  when: $reviewer_budget.output.full_review == 'yes'
  timeout: 120000
- id: detector_findings
  bash: 'set -eu

    ARTIFACTS_DIR="$ARTIFACTS_DIR" .archon/scripts/adapty-build-detector-findings.py'
  depends_on:
  - build_reviewer_packets
  when: $reviewer_budget.output.full_review == 'yes'
  timeout: 30000
- id: prepare_frontend_docker_runtime
  bash: "set -u\nmkdir -p \"$ARTIFACTS_DIR/bin\" \"$ARTIFACTS_DIR/checks\"\nname_script=\"$ARTIFACTS_DIR/bin/frontend-container-name\"\
    \nexec_script=\"$ARTIFACTS_DIR/bin/frontend-docker-exec\"\n\ncat > \"$name_script\" <<'EOF'\n#!/bin/sh\nset -eu\nslug=\"\
    $(printf '%s' \"$WORKFLOW_ID\" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/--*/-/g; s/^-//; s/-$//' |\
    \ cut -c1-48)\"\n[ -n \"$slug\" ] || slug=unknown\necho \"archon-fe-$slug\"\nEOF\nchmod +x \"$name_script\"\n\nCONTAINER_WORKTREE=\"\
    $(pwd -P)\"\ncase \"$CONTAINER_WORKTREE\" in\n  /.archon/*) HOST_WORKTREE=\"/srv/archon-data${CONTAINER_WORKTREE#/.archon}\"\
    \ ;;\n  /srv/archon-data/*) HOST_WORKTREE=\"$CONTAINER_WORKTREE\" ;;\n  *)\n    echo \"Unsupported worktree path for Docker\
    \ bind mount: $CONTAINER_WORKTREE\" >&2\n    exit 3\n    ;;\nesac\n\ncase \"$HOST_WORKTREE\" in\n  */worktrees/archon/*)\n\
    \    HOST_REPO_ROOT=\"${HOST_WORKTREE%%/worktrees/archon/*}\"\n    HOST_WORKTREE_REL=\"${HOST_WORKTREE#$HOST_REPO_ROOT/}\"\
    \n    ;;\n  */source)\n    HOST_REPO_ROOT=\"${HOST_WORKTREE%/source}\"\n    HOST_WORKTREE_REL=\"source\"\n    ;;\n  *)\n\
    \    echo \"Unsupported Adapty workspace layout: $HOST_WORKTREE\" >&2\n    exit 3\n    ;;\nesac\nCONTAINER_WORKDIR=\"\
    /repo/$HOST_WORKTREE_REL\"\nCONTAINER_STORE=\"/repo/.pnpm-store\"\n\nif ! docker run --rm -v \"$HOST_REPO_ROOT:/repo:ro\"\
    \ alpine sh -lc \"test -e '$CONTAINER_WORKDIR/.git'\"; then\n  echo \"Host repository root is not visible to Docker daemon:\
    \ $HOST_REPO_ROOT\" >&2\n  exit 3\nfi\n\ncat > \"$exec_script\" <<EOF\n#!/bin/sh\nset -eu\ncontainer=\"\\$(\"$name_script\"\
    )\"\nif [ \"\\$(docker inspect -f '{{.State.Running}}' \"\\$container\" 2>/dev/null || true)\" != \"true\" ]; then\n \
    \ echo \"Frontend container is not running: \\$container\" >&2\n  exit 3\nfi\nexec docker exec -w \"$CONTAINER_WORKDIR\"\
    \ \"\\$container\" \"\\$@\"\nEOF\nchmod +x \"$exec_script\"\n\ncontainer=\"$(\"$name_script\")\"\nstate=\"$(docker inspect\
    \ -f '{{.State.Status}}' \"$container\" 2>/dev/null || true)\"\nif [ \"$state\" = \"running\" ]; then\n  echo \"Reusing\
    \ frontend container: $container\"\nelse\n  if [ -n \"$state\" ]; then\n    docker rm -f \"$container\" >/dev/null 2>&1\
    \ || true\n  fi\n  docker run -d           --name \"$container\"           --label \"archon.workflow.id=$WORKFLOW_ID\"\
    \           --label \"archon.role=frontend-workflow\"           --label \"archon.project=adapty-dashboard-interface\"\
    \           --network archon_archon-network           -v \"$HOST_REPO_ROOT:/repo\"           -w \"$CONTAINER_WORKDIR\"\
    \           -e CI=false           -e COREPACK_ENABLE_DOWNLOAD_PROMPT=0           node:22.21.0-bookworm           sh -lc\
    \ \"mkdir -p /tmp/archon '$CONTAINER_STORE' && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm config\
    \ set store-dir '$CONTAINER_STORE' && touch /tmp/archon/runtime-ready && tail -f /dev/null\"\nfi\nfor i in $(seq 1 120);\
    \ do\n  if docker exec \"$container\" test -f /tmp/archon/runtime-ready >/dev/null 2>&1; then\n    break\n  fi\n  state=\"\
    $(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' \"$container\" 2>/dev/null || true)\"\n  case \"$state\" in\
    \ exited*|dead*) docker logs \"$container\" || true; exit 3 ;; esac\n  sleep 1\ndone\nif ! docker exec \"$container\"\
    \ test -f /tmp/archon/runtime-ready >/dev/null 2>&1; then\n  docker logs \"$container\" || true\n  echo \"Frontend container\
    \ did not become ready: $container\" >&2\n  exit 3\nfi\nif ! docker exec -w \"$CONTAINER_WORKDIR\" \"$container\" sh -lc\
    \ \"echo link-test > '$CONTAINER_STORE/.archon-link-test-source' && rm -f .archon-link-test-target && ln '$CONTAINER_STORE/.archon-link-test-source'\
    \ .archon-link-test-target\"; then\n  echo \"pnpm store cannot hardlink into worktree; check Docker mounts\" >&2\n  exit\
    \ 3\nfi\ndocker exec -w \"$CONTAINER_WORKDIR\" \"$container\" sh -lc \"rm -f '$CONTAINER_STORE/.archon-link-test-source'\
    \ .archon-link-test-target\" >/dev/null 2>&1 || true\necho \"Docker frontend container ready: $container ($CONTAINER_WORKDIR,\
    \ store $CONTAINER_STORE)\"\n"
  depends_on:
  - ownership_summary
  when: $ownership_summary.output.needs_proof == 'yes'
  timeout: 300000
- id: ensure_dependencies
  bash: "set -u\nmkdir -p \"$ARTIFACTS_DIR/checks\"\nlog=\"$ARTIFACTS_DIR/checks/install.log\"\n{\n  echo \"## install (docker)\"\
    \n  echo\n  echo '```'\n  \"$ARTIFACTS_DIR/bin/frontend-docker-exec\" sh -lc 'if [ -d node_modules ] && [ -x node_modules/.bin/eslint\
    \ ] && [ -x node_modules/.bin/vitest ]; then echo \"Dependencies already installed.\"; else pnpm install --frozen-lockfile;\
    \ fi'\n  status=$?\n  echo '```'\n  echo\n  echo \"Exit code: ${status}\"\n} > \"$log\" 2>&1\ncat \"$log\"\nexit \"$status\"\
    \n"
  depends_on:
  - prepare_frontend_docker_runtime
  - ownership_summary
  when: $ownership_summary.output.needs_proof == 'yes'
  timeout: 3600000
- id: review_architecture
  prompt: "Run the architecture review lens using the compact JSON reviewer packet.\n\nDo not load or invoke repository skills.\
    \ Do not read `.agents/skills/*`, `.codex/skills/*`, or any skill `SKILL.md`; this workflow owns the review procedure.\n\
    Stay inside the current checkout and `$ARTIFACTS_DIR`. Never search from `/.archon/workspaces`, `/srv/archon-data/workspaces`,\
    \ a workspace root, or `worktrees/archon`; never read another thread worktree.\nDo not use Agent, Task, subagent, or delegation\
    \ tools. This node must write its own JSON artifacts directly.\n\nRead only `$ARTIFACTS_DIR/review/reviewer-inputs/reviewer-input-architecture.json`\
    \ first.\nDo not read `$ARTIFACTS_DIR/review/surface.json`.\nDo not read reviewer markdown or broad artifact directories.\n\
    The packet already contains focused diff excerpts, import deltas, and caller hits. Use those first.\nAllowed tools in\
    \ this node are Read and Write only. Do not use Bash, Grep, Glob, find, ls, git diff, or package-discovery commands here.\n\
    You may Read only files named in the packet and contract docs listed in the packet when a critical detail is missing or\
    \ contradictory.\nStay read-only for repository files. Do not edit source files.\n\nUse the packet checklist, focused\
    \ diff excerpts, import deltas, and precomputed context as candidate focus. Final MR ownership is proven later by ownership\
    \ gate, not here.\nFor TypeScript compatibility concerns, rely on `precomputed_context.callsite_facts` first. Do not create\
    \ a candidate for possible unmigrated callers when callsite facts are complete and the recorded callsites all use the\
    \ new argument shape. Do not create candidates for issues that are fully handled by a deterministic `tsc`/build check\
    \ unless the type design compiles but misrepresents the runtime contract.\nReport candidate observations only when they\
    \ appear on changed hunk data, may be caused by changed contracts, may be newly exposed by this MR, or may be made worse\
    \ by this MR.\nIf an issue appears pre-existing or outside the MR boundary, put it under `incidental_observations` only.\n\
    Use only concrete, actionable observations. Include file, line, exact symbol/behavior, and a causality hypothesis, not\
    \ a proven ownership verdict.\n\nWrite `$ARTIFACTS_DIR/review/reviewer-findings-architecture.json` with this exact shape:\n\
    ```json\n{\n  \"schema_version\": 1,\n  \"reviewer\": \"architecture\",\n  \"status\": \"completed\",\n  \"candidates\"\
    : [\n    {\n      \"severity_hypothesis\": \"P1|P2|P3\",\n      \"title\": \"short title\",\n      \"file\": \"relative/path.ts\"\
    ,\n      \"line\": 123,\n      \"claim_type\": \"query_key_scope|export_collision|nullability|race|effect_dependency|api_contract|ui_state|type_safety|other\"\
    ,\n      \"symbol\": \"optional exact symbol\",\n      \"claim\": \"one sentence\",\n      \"causality_hypothesis\": \"\
    one sentence, not proven\",\n      \"evidence\": [\"compact evidence bullet\"],\n      \"ownership_check\": {\"base_head_focus\"\
    :\"exact comparison needed\", \"suggested_commands\":[\"git diff $BASE_REF...HEAD -- relative/path.ts\"]},\n      \"proof_plan\"\
    : \"one sentence\",\n      \"likely_check_command\": \"optional narrow command\"\n    }\n  ],\n  \"incidental_observations\"\
    : [\n    {\"title\":\"short\", \"file\":\"relative/path.ts\", \"reason\":\"pre-existing or outside MR boundary\"}\n  ]\n\
    }\n```\n\nKeep evidence compact. Do not write markdown tables or long code snippets.\nAlso write `$ARTIFACTS_DIR/review/reviewer-summary-architecture.json`\
    \ with compact JSON:\n`{\"reviewer\":\"architecture\",\"artifact\":\"reviewer-findings-architecture.json\",\"status\"\
    :\"completed\",\"findings\":<candidate_count>,\"incidental_observations\":<n>}`.\n\nPrint exactly: `Reviewer architecture:\
    \ <n> candidates, <n> incidental.`\n\nStrict output and candidate budget:\n- Do not write progress narration to stdout.\
    \ Never write phrases like \"Now let me\", \"I have enough\", or \"I will\".\n- The final stdout response must be exactly\
    \ the requested one-line `Reviewer ...` summary and nothing else.\n- Emit at most 5 candidates. Put weaker, compatibility-only,\
    \ or tech-debt-only observations into `incidental_observations`.\n- Do not create candidates from syntax compatibility\
    \ alone; require concrete behavior or contract break.\n"
  provider: claude
  model: claude-sonnet-4-6
  effort: medium
  context: fresh
  depends_on:
  - build_reviewer_packets
  when: $reviewer_budget.output.architecture == 'yes'
  idle_timeout: 900000
  allowed_tools:
  - Read
  - Write
