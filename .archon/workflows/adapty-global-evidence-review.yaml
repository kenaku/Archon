- id: candidate_summary
  bash: "set -u\nARTIFACTS_DIR=\"$ARTIFACTS_DIR\" python3 - <<'PYSUMMARY'\nimport json, os\nreview_dir = os.path.join(os.environ[\"\
    ARTIFACTS_DIR\"], \"review\")\npath = os.path.join(review_dir, \"candidate-summary.json\")\nwith open(path, encoding=\"\
    utf-8\") as fh:\n    data = json.load(fh)\nsummary = data.get(\"summary\") if isinstance(data.get(\"summary\"), dict)\
    \ else {}\n\ndef first(*values, default=None):\n    for value in values:\n        if value is not None:\n            return\
    \ value\n    return default\n\n# Triage historically wrote these fields under summary; downstream workflow\n# conditions\
    \ require stable top-level aliases.\ndata[\"needs_ownership_gate\"] = first(data.get(\"needs_ownership_gate\"), summary.get(\"\
    needs_ownership_gate\"), default=\"no\")\ndata[\"needs_proof\"] = first(data.get(\"needs_proof\"), summary.get(\"needs_proof\"\
    ), default=\"no\")\ndata[\"kept_candidates\"] = first(data.get(\"kept_candidates\"), summary.get(\"kept_candidates\"),\
    \ default=0)\ndata[\"incidental_observations\"] = first(data.get(\"incidental_observations\"), summary.get(\"incidental_observations\"\
    ), default=0)\nwith open(path, \"w\", encoding=\"utf-8\") as fh:\n    json.dump(data, fh, ensure_ascii=False, indent=2)\n\
    \    fh.write(\"\\n\")\n\ncandidates_path = os.path.join(review_dir, \"candidates.json\")\nif data.get(\"needs_ownership_gate\"\
    ) == \"yes\" or data.get(\"needs_proof\") == \"yes\":\n    if not os.path.exists(candidates_path):\n        raise SystemExit(\"\
    candidate-summary requires candidates.json when ownership gate is needed\")\n    with open(candidates_path, encoding=\"\
    utf-8\") as fh:\n        candidates = json.load(fh)\n    if not isinstance(candidates.get(\"candidates\"), list):\n  \
    \      raise SystemExit(\"candidates.json must contain candidates[]\")\nprint(json.dumps(data, ensure_ascii=False, separators=(\"\
    ,\", \":\")))\nPYSUMMARY"
  depends_on:
  - triage_candidates
  when: $reviewer_budget.output.full_review == 'yes'
  trigger_rule: all_done
  timeout: 15000
- id: ownership_gate
  command: adapty-global-review-ownership-gate
  provider: claude
  model: claude-haiku-4-5
  effort: medium
  context: fresh
  depends_on:
  - candidate_summary
  when: $candidate_summary.output.needs_ownership_gate == 'yes'
  idle_timeout: 1200000
- id: ownership_summary
  bash: "set -u\nARTIFACTS_DIR=\"$ARTIFACTS_DIR\" python3 - <<'PYOWN'\nimport json, os, sys\nreview_dir = os.path.join(os.environ[\"\
    ARTIFACTS_DIR\"], \"review\")\npath = os.path.join(review_dir, \"ownership-summary.json\")\ncandidate_summary = os.path.join(review_dir,\
    \ \"candidate-summary.json\")\nfanout_failure = os.path.join(review_dir, \"fanout-failure.json\")\nif os.path.exists(path):\n\
    \    with open(path, encoding=\"utf-8\") as fh:\n        data = json.load(fh)\n    print(json.dumps(data, ensure_ascii=False,\
    \ separators=(\",\", \":\")))\n    raise SystemExit(0)\nif os.path.exists(fanout_failure):\n    data = {\"input_candidates\"\
    : 0, \"passed\": 0, \"rejected\": 0, \"unknown\": 0, \"needs_proof\": \"no\", \"status\": \"invalid_upstream\", \"reason\"\
    : \"fanout failed; ownership gate not trustworthy\"}\nelif not os.path.exists(candidate_summary):\n    data = {\"input_candidates\"\
    : 0, \"passed\": 0, \"rejected\": 0, \"unknown\": 0, \"needs_proof\": \"no\", \"status\": \"invalid_upstream\", \"reason\"\
    : \"candidate-summary.json missing after full review\"}\nelse:\n    with open(candidate_summary, encoding=\"utf-8\") as\
    \ fh:\n        c = json.load(fh)\n    if c.get(\"needs_ownership_gate\") == \"yes\":\n        data = {\"input_candidates\"\
    : c.get(\"kept_candidates\", 0), \"passed\": 0, \"rejected\": 0, \"unknown\": 0, \"needs_proof\": \"no\", \"status\":\
    \ \"invalid_upstream\", \"reason\": \"ownership gate was required but did not produce ownership-summary.json\"}\n    else:\n\
    \        data = {\"input_candidates\": c.get(\"kept_candidates\", 0), \"passed\": 0, \"rejected\": 0, \"unknown\": 0,\
    \ \"needs_proof\": \"no\", \"status\": \"not_needed\", \"reason\": \"triage produced zero candidates\"}\nos.makedirs(review_dir,\
    \ exist_ok=True)\nwith open(path, \"w\", encoding=\"utf-8\") as fh:\n    json.dump(data, fh, ensure_ascii=False, indent=2)\n\
    \    fh.write(\"\\n\")\nprint(json.dumps(data, ensure_ascii=False, separators=(\",\", \":\")))\nif data.get(\"status\"\
    ) == \"invalid_upstream\":\n    raise SystemExit(1)\nPYOWN\n"
  depends_on:
  - candidate_summary
  - ownership_gate
  when: $reviewer_budget.output.full_review == 'yes'
  trigger_rule: all_done
  timeout: 15000
