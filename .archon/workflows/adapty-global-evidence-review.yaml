- id: assert_review_fanout
  bash: "set -eu\nARTIFACTS_DIR=\"$ARTIFACTS_DIR\" python3 - <<'PYASSERT'\nimport json, os, sys\n\nreviewers = [\"architecture\"\
    , \"typescript\", \"races\", \"security_performance\", \"styling\", \"simplicity\", \"playbooks\"]\nsummary_files = {\n\
    \    \"architecture\": \"reviewer-summary-architecture.json\",\n    \"typescript\": \"reviewer-summary-typescript.json\"\
    ,\n    \"races\": \"reviewer-summary-races.json\",\n    \"security_performance\": \"reviewer-summary-security-performance.json\"\
    ,\n    \"styling\": \"reviewer-summary-styling.json\",\n    \"simplicity\": \"reviewer-summary-simplicity.json\",\n  \
    \  \"playbooks\": \"reviewer-summary-playbooks.json\",\n}\nreview_dir = os.path.join(os.environ[\"ARTIFACTS_DIR\"], \"\
    review\")\nrouting_path = os.path.join(review_dir, \"routing-normalized.json\")\nwith open(routing_path, encoding=\"utf-8\"\
    ) as fh:\n    routing = json.load(fh)\n\nexpected = [name for name in reviewers if routing.get(name) == \"yes\"]\nif routing.get(\"\
    full_review\") != \"yes\":\n    print(\"Fanout gate: skipped for fast path\")\n    raise SystemExit(0)\nif not expected:\n\
    \    failure = \"Fanout gate failed: full_review=yes but no reviewers were routed yes.\"\n    with open(os.path.join(review_dir,\
    \ \"fanout-failure.json\"), \"w\", encoding=\"utf-8\") as fh:\n        json.dump({\"schema_version\": 1, \"failure\":\
    \ failure, \"missing\": [], \"invalid\": []}, fh, ensure_ascii=False, indent=2)\n        fh.write(\"\\n\")\n    print(failure,\
    \ file=sys.stderr)\n    raise SystemExit(1)\n\nmissing = []\ninvalid = []\nfor name in expected:\n    path = os.path.join(review_dir,\
    \ summary_files[name])\n    if not os.path.exists(path):\n        missing.append(f\"{name}: {summary_files[name]} missing\"\
    )\n        continue\n    try:\n        with open(path, encoding=\"utf-8\") as fh:\n            summary = json.load(fh)\n\
    \    except Exception as exc:\n        invalid.append(f\"{name}: cannot parse {summary_files[name]} ({exc})\")\n     \
    \   continue\n    if summary.get(\"reviewer\") != name:\n        invalid.append(f\"{name}: reviewer field is {summary.get('reviewer')!r}\"\
    )\n    if summary.get(\"status\") != \"completed\":\n        invalid.append(f\"{name}: status is {summary.get('status')!r}\"\
    )\n    for key in [\"findings\", \"incidental_observations\"]:\n        if not isinstance(summary.get(key), int):\n  \
    \          invalid.append(f\"{name}: {key} must be an integer\")\n\nif missing or invalid:\n    failure_path = os.path.join(review_dir,\
    \ \"fanout-failure.json\")\n    with open(failure_path, \"w\", encoding=\"utf-8\") as fh:\n        json.dump({\"schema_version\"\
    : 1, \"failure\": \"Full review required reviewer fanout, but required reviewer artifacts are absent or invalid.\", \"\
    missing\": missing, \"invalid\": invalid}, fh, ensure_ascii=False, indent=2)\n        fh.write(\"\\n\")\n    print(f\"\
    Fanout gate failed. See {failure_path}\", file=sys.stderr)\n    raise SystemExit(1)\n\nprint(\"Fanout gate passed: \"\
    \ + \", \".join(expected))\nPYASSERT\n"
  depends_on:
  - reviewer_budget
  - review_architecture
  - review_typescript
  - review_races
  - review_security_performance
  - review_styling
  - review_simplicity
  - review_playbooks
  when: $reviewer_budget.output.full_review == 'yes'
  trigger_rule: all_done
  timeout: 15000
